<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifiera e-post — doc-harbor</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo svg {
      width: 72px;
      height: 72px;
    }
    h1 {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      text-align: center;
      font-size: 0.82rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #8b949e;
    }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      letter-spacing: 0.2em;
      font-size: 1.1rem;
      text-align: center;
    }
    input:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56,139,253,0.15);
    }
    button {
      width: 100%;
      padding: 0.55rem;
      background: #1a7f37;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #116329; }
    .error {
      background: #3d1c1c;
      color: #f85149;
      border: 1px solid rgba(248,81,73,0.2);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .footer-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #8b949e;
    }
    .footer-link a { color: #58a6ff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 72px; height: 72px; display: block; margin: 0 auto;">
        <defs>
          <radialGradient id="verify-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0969da" stop-opacity="1"/>
            <stop offset="100%" stop-color="#050505" stop-opacity="0.2"/>
          </radialGradient>
        </defs>
        <circle cx="50%" cy="50%" r="48" fill="url(#verify-glow)"/>
        <circle cx="50%" cy="50%" r="45" fill="#0c0e12" stroke="#1d222e" stroke-width="2"/>
        <g stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M50,22 L50,68"/>
          <path d="M38,36 L62,36"/>
          <path d="M32,54 C35,68 65,68 68,54"/>
          <path d="M26,50 L32,54 L28,60"/>
          <path d="M74,50 L68,54 L72,60"/>
          <circle cx="50%" cy="22" r="6" fill="#00d2ff" stroke="none"/>
          <path d="M45,38 L48,34 L51,38 Z" fill="#fff" stroke="none"/>
        </g>
      </svg>
    </div>
    <h1>Verifiera din e-post</h1>
    <p class="subtitle">Vi skickade en 6-siffrig kod till<br><strong>{{ email }}</strong></p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/verify">
      <input type="hidden" name="email" value="{{ email }}">
      <label for="code">Verifieringskod</label>
      <input type="text" id="code" name="code" required autofocus
             maxlength="6" pattern="[0-9]{6}" placeholder="123456"
             inputmode="numeric" autocomplete="one-time-code">
      <label for="password">Välj lösenord</label>
      <input type="password" id="password" name="password" required
             minlength="8" placeholder="Minst 8 tecken">
      <label for="confirm_password">Bekräfta lösenord</label>
      <input type="password" id="confirm_password" name="confirm_password" required
             minlength="8" placeholder="Upprepa lösenordet">
      <button type="submit">Skapa konto →</button>
    </form>
    <div class="footer-link">
      Fick du ingen kod? <a href="/register">Börja om</a>
    </div>
  </div>
</body>
</html>
